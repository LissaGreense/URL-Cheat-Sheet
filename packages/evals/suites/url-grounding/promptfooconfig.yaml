description: URL-grounded chat — broader grounding matrix
providers:
  - id: 'file://../../src/providers/agent-provider.ts'
prompts:
  - '{{question}}'
defaultTest:
  assert:
    - type: regex
      value: 'L\d+'
    - type: javascript
      value: 'file://../../src/asserts/grounding-judge.ts'
tests:
  - description: HTCPCP expansion grounded in RFC 2324
    vars:
      kb_url: https://www.rfc-editor.org/rfc/rfc2324.html
      question: What does HTCPCP stand for?
    assert:
      - type: contains
        value: Hyper Text Coffee Pot Control Protocol
  - description: 418 status code lookup
    vars:
      kb_url: https://www.rfc-editor.org/rfc/rfc2324.html
      question: What HTTP status code does RFC 2324 reserve for teapots?
    assert:
      - type: contains
        value: '418'
  - description: HTCPCP-TEA varieties
    vars:
      kb_url: https://www.rfc-editor.org/rfc/rfc7168.html
      question: Which tea varieties does the HTCPCP-TEA extension define?
  - description: HTCPCP Wikipedia summary
    vars:
      kb_url: https://en.wikipedia.org/wiki/Hyper_Text_Coffee_Pot_Control_Protocol
      question: When was HTCPCP first published?
  - description: HTTP 418 origin per Wikipedia
    vars:
      kb_url: https://en.wikipedia.org/wiki/HTTP_418
      question: Which RFC originally defined HTTP status 418?
    assert:
      - type: contains
        value: '2324'
  # Trap cases anchor the navigation-tools fix (calibration rows 6 + 10).
  # Each test relies on:
  #   1. The global defaultTest L\d+ regex (citation required).
  #   2. The global grounding-judge.ts JS assert (semantic groundedness — judge
  #      threshold 0.7, distinguishes fabrication from named-disclaimer).
  #   3. A per-case `contains: 'does not'` conformance check that the agent
  #      followed the strict refusal phrasing from SYSTEM_PROMPT.
  # Per-case `not-contains` keyword guards were removed after T6 (ucs-4il)
  # observed a false positive on a *higher-quality* refusal that explicitly
  # disclaimed absent terms ("Terms like matcha, sencha do not appear...").
  # The judge correctly grades these as PASS; the keyword guards conflated
  # named-fabrication with named-disclaimer. If T7 verification ever shows
  # the judge accepting an actual fabrication, add fabrication-shape regex
  # asserts (e.g. /supports? matcha/) rather than blanket keyword bans.
  - description: 'trap: HTCPCP does not specify encryption (must refuse, not fabricate)'
    vars:
      kb_url: https://www.rfc-editor.org/rfc/rfc2324.html
      question: What encryption algorithms does HTCPCP use?
    assert:
      - type: contains
        value: 'does not'
  - description: 'trap: RFC 7168 does not specify Japanese tea varieties (must refuse, not fabricate)'
    vars:
      kb_url: https://www.rfc-editor.org/rfc/rfc7168.html
      question: What Japanese tea varieties does this protocol define?
    assert:
      - type: contains
        value: 'does not'
  # ucs-8nl: exercises the pipe-alternation grep form. A natural answer
  # requires bundling status-code synonyms ("status|code|418|response|
  # error") into one grep call; the prior `string | string[]` schema
  # interpreted pipe-joined strings as a single literal and returned zero
  # hits, forcing fabrication or refusal. After the schema change the
  # model can land the answer in 1-2 grep calls.
  - description: HTCPCP error/status codes (exercises pipe-alternation grep)
    vars:
      kb_url: https://www.rfc-editor.org/rfc/rfc2324.html
      question: Which HTTP status codes does HTCPCP define for protocol errors?
    assert:
      - type: contains
        value: '418'
